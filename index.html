<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statusoverzicht – Kanban</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p>Laden...</p></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="35" cy="22" r="14" fill="#F7931E"/>
        <circle cx="65" cy="22" r="14" fill="#F7931E"/>
        <circle cx="50" cy="60" r="13" fill="#F7931E"/>
        <path d="M18 48 Q18 72 50 82 Q82 72 82 48 Q82 36 65 36 Q57 36 50 46 Q43 36 35 36 Q18 36 18 48Z" fill="#cccccc"/>
      </svg>
    </div>
    <h1>Statusoverzicht</h1>
    <p class="subtitle">Dossier Beheer</p>
    <label for="emailInput">E-mailadres</label>
    <input type="email" id="emailInput" placeholder="naam@kantoor.nl" autocomplete="email">
    <label for="passwordInput">Wachtwoord</label>
    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="signIn()">Inloggen</button>
    <p class="login-msg" id="loginMsg"></p>
  </div>
</div>

<div id="appScreen">
  <header>
    <div class="header-inner">
    <div class="logo-wrap">
      <svg class="header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="35" cy="22" r="14" fill="#F7931E"/>
        <circle cx="65" cy="22" r="14" fill="#F7931E"/>
        <circle cx="50" cy="60" r="13" fill="#F7931E"/>
        <path d="M18 48 Q18 72 50 82 Q82 72 82 48 Q82 36 65 36 Q57 36 50 46 Q43 36 35 36 Q18 36 18 48Z" fill="#cccccc"/>
      </svg>
    </div>
    <div class="page-title">
      <h1>Statusoverzicht</h1>
      <span class="header-subtitle">Dossier Beheer</span>
    </div>
    <div class="header-actions">
      <span id="userEmail"></span>
      <button class="btn btn-ghost" onclick="window.location.href='toevoegingen.html'">Toevoegingen</button>
      <button class="btn btn-ghost" onclick="window.location.href='changelog.html'">Wijzigingen</button>
      <button class="btn btn-ghost" onclick="window.location.href='settings.html'">Instellingen</button>
      <button class="btn btn-ghost" onclick="signOut()">Uitloggen</button>
    </div>
    </div>
  </header>
  <div class="toolbar">
    <div class="view-toggle">
      <button class="view-btn active" title="Kaartweergave" onclick="window.location.href='index.html'"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
      <button class="view-btn" title="Lijstweergave" onclick="window.location.href='statusoverzicht.html'"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="7" width="14" height="2" rx="1"/><rect x="1" y="12" width="14" height="2" rx="1"/></svg></button>
    </div>
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="#999" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M14 14l4 4"/></svg>
      <input type="text" id="searchInput" placeholder="Zoek op klantnaam..." oninput="filterCards(this.value);document.getElementById('searchClear').style.display=this.value?'flex':'none'">
      <button id="searchClear" class="search-clear" style="display:none" onclick="document.getElementById('searchInput').value='';filterCards('');this.style.display='none';document.getElementById('searchInput').focus()">×</button>
    </div>
    <button class="filter-tag" onclick="setFilter('alarm', this)">Actie vereist</button>
    <select class="kanban-sort-select toolbar-sort" onchange="setSort(this.value)">
      <option value="alarm">⚡ Alarm</option>
      <option value="naam">A→Z Naam</option>
      <option value="datum">Datum</option>
    </select>
    <button class="btn btn-primary" onclick="addRow()">+ Nieuwe klant</button>
  </div>
  <div class="kanban-wrapper" id="kanbanBoard"></div>
  <div class="kanban-scroll-track" id="kanbanScrollTrack" style="display:none">
    <input type="range" id="kanbanScroller" min="0" value="0" step="1">
  </div>
</div>

<div id="toast"></div>

<script src="changelog.js"></script>
<script src="app.js"></script>
</body>
</html>
