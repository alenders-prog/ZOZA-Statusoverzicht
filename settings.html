<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instellingen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Override: inputs in alarm table always visible ── */
#alarmTable td input { display: block !important; }

/* ── Settings-specific layout ── */
.settings-body {
  max-width: 680px;
  margin: 48px auto;
  padding: 0 24px;
}
.settings-card {
  background: var(--white);
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  overflow: hidden;
}
.settings-section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 24px 16px;
  border-bottom: 2px solid var(--orange);
}
.settings-section-title {
  font-size: 0.92rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--orange-dark);
}
.settings-section-desc {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--grey);
  margin-left: auto;
}
#alarmTable {
  width: 100%;
  border-collapse: collapse;
}
#alarmTable thead th {
  font-family: 'Nunito', sans-serif;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 10px 24px;
  background: var(--orange-soft);
  color: var(--orange-dark);
  border-bottom: 1px solid var(--orange-mid);
  text-align: left;
}
#alarmTable thead th.th-val {
  text-align: right;
  width: 180px;
}
#alarmTable tbody tr {
  border-bottom: 1px solid var(--grey-rule);
  transition: background 0.1s;
}
#alarmTable tbody tr:last-child { border-bottom: none; }
#alarmTable tbody tr:hover { background: var(--orange-soft); }
#alarmTable tbody td {
  padding: 10px 24px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--ink);
}
#alarmTable tbody td.td-val { text-align: right; }
.days-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.days-input {
  font-family: 'Nunito', sans-serif;
  font-size: 0.83rem;
  font-weight: 700;
  width: 80px;
  padding: 5px 10px;
  border: 1.5px solid var(--grey-rule);
  border-radius: 8px;
  background: var(--white);
  color: var(--ink);
  outline: none;
  text-align: right;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}
.days-input::-webkit-outer-spin-button,
.days-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.days-input:focus { border-color: var(--orange); }
.unit-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--grey);
  white-space: nowrap;
}
.save-bar {
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  border-top: 1px solid var(--grey-rule);
  background: var(--grey-light);
}
.save-note {
  font-size: 0.70rem;
  font-weight: 600;
  color: var(--grey);
}
#saveStatus {
  font-size: 0.70rem;
  font-weight: 700;
  color: var(--green);
}
#dbError {
  display: none;
  background: #FDECEA;
  border: 1px solid #F5A8A0;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: #8B1A10;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p>Laden...</p></div>

<div id="appScreen">
  <header>
    <div class="header-inner">
      <svg class="header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="35" cy="22" r="14" fill="#F7931E"/>
        <circle cx="65" cy="22" r="14" fill="#F7931E"/>
        <circle cx="50" cy="60" r="13" fill="#F7931E"/>
        <path d="M18 48 Q18 72 50 82 Q82 72 82 48 Q82 36 65 36 Q57 36 50 46 Q43 36 35 36 Q18 36 18 48Z" fill="#cccccc"/>
      </svg>
      <h1>Instellingen</h1>
      <div class="header-actions">
        <span id="userEmail"></span>
        <button class="btn btn-ghost" onclick="window.location.href='index.html'">← Terug</button>
      </div>
    </div>
  </header>

  <div class="settings-body">
    <div id="dbError"></div>
    <div class="settings-card">
      <div class="settings-section-header">
        <span class="settings-section-title">Alarminstellingen</span>
        <span class="settings-section-desc">Aantal dagen waarna een alarm wordt getoond</span>
      </div>
      <table id="alarmTable">
        <thead>
          <tr>
            <th>Naam</th>
            <th class="th-val">Waarde</th>
          </tr>
        </thead>
        <tbody id="alarmBody"></tbody>
      </table>
      <div class="save-bar">
        <span class="save-note">Wijzigingen worden automatisch opgeslagen</span>
        <span id="saveStatus">● opgeslagen</span>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://iubmajperipojqtlhwqk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1Ym1hanBlcmlwb2pxdGxod3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODM2MzcsImV4cCI6MjA5NDA1OTYzN30.IiUQAGO9rFuSC2LQlFr6dzmQPatCS-N7mjZdJzEQRNs';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ALARM_ROWS = [
  { key: 'info_voor_afspraak',            label: 'Info binnen voor afspraak' },
  { key: 'reactie_docs_teurlings',        label: 'Reactietijd toevoeging bevestigd' },
  { key: 'reactie_klanten_concepten',     label: 'Reactietijd klanten op concepten' },
  { key: 'reactie_teurlings_concepten',   label: 'Reactietijd advocaat op concepten' },
  { key: 'reactie_beschikking',           label: 'Reactietijd Beschikking' },
  { key: 'reactie_akkoord_beschikking',   label: 'Reactietijd Akkoord klanten op beschikking' },
  { key: 'reactie_inschrijving_gemeente', label: 'Reactietijd Inschrijving gemeente' },
  { key: 'reactie_vergoeding_rvr',        label: 'Reactietijd Vergoeding RvR Ontvangen' },
  { key: 'pensioenverklaring_termijn',   label: 'Pensioenverklaring termijn na beschikking' },
];

let settings = JSON.parse(localStorage.getItem('alarmsettings') || '{}');
let saveTimer = null;

function setSaveStatus(state) {
  const el = document.getElementById('saveStatus');
  if (state === 'saving') { el.style.color = 'var(--orange)'; el.textContent = '● opslaan...'; }
  else if (state === 'error') { el.style.color = '#C0392B'; el.textContent = '● fout'; }
  else { el.style.color = 'var(--green)'; el.textContent = '● opgeslagen'; }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveStatus('saving');
  saveTimer = setTimeout(saveSettings, 700);
}

async function saveSettings() {
  localStorage.setItem('alarmsettings', JSON.stringify(settings));
  const { error } = await db.from('alarmsettings').upsert({ id: 'main', settings });
  const el = document.getElementById('dbError');
  if (error) {
    el.textContent = `Database fout bij opslaan:\n${error.message}\n(code: ${error.code})`;
    el.style.display = 'block';
    setSaveStatus('error');
  } else {
    el.style.display = 'none';
    setSaveStatus('saved');
  }
}

function renderAlarmTable() {
  const tbody = document.getElementById('alarmBody');
  tbody.innerHTML = '';

  ALARM_ROWS.forEach(row => {
    const tr = document.createElement('tr');

    const nameTd = document.createElement('td');
    nameTd.textContent = row.label;

    const valTd = document.createElement('td');
    valTd.className = 'td-val';

    const wrap = document.createElement('div');
    wrap.className = 'days-wrap';

    const valInput = document.createElement('input');
    valInput.type = 'number';
    valInput.min = '0';
    valInput.value = settings[row.key] || '';
    valInput.placeholder = '—';
    valInput.className = 'days-input';
    valInput.addEventListener('focus', () => valInput.style.borderColor = 'var(--orange)');
    valInput.addEventListener('blur',  () => valInput.style.borderColor = 'var(--grey-rule)');
    valInput.oninput = () => { settings[row.key] = valInput.value; scheduleSave(); };

    const unit = document.createElement('span');
    unit.className = 'unit-label';
    unit.textContent = 'dagen';

    wrap.appendChild(valInput);
    wrap.appendChild(unit);
    valTd.appendChild(wrap);

    tr.appendChild(nameTd);
    tr.appendChild(valTd);
    tbody.appendChild(tr);
  });
}

async function init() {
  const { data: { session } } = await db.auth.getSession();
  document.getElementById('loadingOverlay').style.display = 'none';
  if (!session) { window.location.href = 'index.html'; return; }
  document.getElementById('userEmail').textContent = session.user.email;

  const { data, error } = await db.from('alarmsettings').select('settings').eq('id', 'main').maybeSingle();
  if (data && data.settings) {
    settings = data.settings;
    localStorage.setItem('alarmsettings', JSON.stringify(settings));
  } else {
    const msg = error
      ? `Database fout bij laden:\n${error.message}\n(code: ${error.code})`
      : 'Geen instellingen gevonden in database (alarmsettings tabel leeg of niet toegankelijk).';
    const el = document.getElementById('dbError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  renderAlarmTable();
  document.getElementById('appScreen').style.display = 'block';
}

init();
</script>
</body>
</html>
