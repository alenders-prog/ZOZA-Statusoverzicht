<style>
.header-klant { display: flex; flex-direction: column; justify-content: center; }
.header-klant h1 { line-height: 1.1; }
.page-body { padding: 24px 28px; max-width: 1400px; }
#fact-tables-wrap { width: fit-content; }
.fact-col-title {
  font-family: 'Nunito', sans-serif; font-size: 0.7rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--grey-text); margin-bottom: 10px;
}
.nw-sect-hdr {
  font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--orange-dark); margin: 18px 0 6px;
  padding-bottom: 5px; border-bottom: 2px solid var(--orange);
}
.fact-tbl {
  border-collapse: collapse; width: auto; min-width: 0;
  font-family: 'Nunito', sans-serif; font-size: 0.80rem; font-weight: 600;
}
.fact-tbl thead th {
  background: var(--orange-soft); color: var(--orange-dark);
  font-size: 0.67rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 5px 8px; text-align: right;
  border-bottom: 2px solid var(--orange); white-space: nowrap;
}
.fact-tbl thead th.th-l { text-align: left; }
.fact-tbl tbody td {
  padding: 4px 8px; border-bottom: 1px solid var(--grey-rule);
  color: var(--ink); vertical-align: middle; text-align: right;
}
.fact-tbl tbody td.td-l { text-align: left; }
.fact-tbl tfoot td {
  padding: 6px 8px; font-weight: 800; font-size: 0.85rem; text-align: right;
  border-top: 2px solid var(--orange);
}
.fact-inp-sm {
  display: inline-block;
  font-family: 'Nunito', sans-serif; font-size: 0.80rem; font-weight: 600;
  border: none; border-bottom: 1.5px solid transparent;
  background: transparent; outline: none; color: var(--ink);
  text-align: right; width: 88px; padding: 1px 2px; box-sizing: border-box;
  min-height: unset;
}
.fact-inp-sm:not(:disabled) { border-bottom-color: #ddd; cursor: text; }
.fact-inp-sm:not(:disabled):focus { border-bottom-color: var(--orange); background: #fff8f0; }
.fact-inp-sm:disabled { color: transparent; pointer-events: none; }
.tab-bar { display: flex; gap: 8px; margin-bottom: 28px; }
.tab-btn {
  font-family: 'Nunito', sans-serif; font-size: 0.92rem; font-weight: 800;
  padding: 8px 22px; border: 1.5px solid var(--grey-rule); border-radius: 20px;
  cursor: pointer; background: var(--white); color: var(--grey-text);
  letter-spacing: 0.01em; transition: all 0.15s; text-transform: none;
}
.tab-btn.active { background: var(--orange); color: var(--white); border-color: var(--orange); }
.tab-btn:hover:not(.active) { border-color: var(--orange); color: var(--orange); }
.tab-btn:hover:not(.active) { border-color: var(--orange); color: var(--orange); }

/* ── Shared form primitives (mirrors facturen.html) ── */
.form-lbl {
  font-size: 0.70rem; font-weight: 800; color: var(--grey);
  text-transform: uppercase; letter-spacing: 0.07em;
}
.form-inp {
  font-family: 'Nunito', sans-serif; font-size: 0.87rem; font-weight: 600;
  border: none; border-bottom: 2px solid var(--grey-rule);
  padding: 5px 3px; outline: none; background: transparent; color: var(--ink);
  width: 100%; box-sizing: border-box; min-height: unset;
}
.form-inp:focus { border-bottom-color: var(--orange); background: #fff8f0; }
.btn-save {
  font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 800;
  background: var(--orange); color: white; border: none; border-radius: 6px;
  padding: 7px 20px; cursor: pointer;
}
.btn-save:hover { background: var(--orange-dark); }

/* ── Richting segmented control (vrije factuur) ── */
.vrij-seg { display:flex; }
.vrij-seg-btn {
  flex:1; padding:6px 14px;
  font-family:'Nunito',sans-serif; font-size:0.78rem; font-weight:700;
  border:1.5px solid var(--grey-rule); background:var(--white); color:var(--grey-text);
  cursor:pointer; transition:all 0.15s;
}
.vrij-seg-btn:first-child { border-radius:20px 0 0 20px; border-right:none; }
.vrij-seg-btn:last-child  { border-radius:0 20px 20px 0; }
.vrij-seg-btn.is-voordeel { background:#E8F5E9; color:#27ae60; border-color:#27ae60; }
.vrij-seg-btn.is-nadeel   { background:#FDECEA; color:#c0392b; border-color:#c0392b; }

/* ── Factuur dialog ── */
.fd-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.42); align-items: center; justify-content: center;
}
.fd-overlay.open { display: flex; }
.fd-box {

  min-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);

}
.fd-title {

}
.fd-fields { display: flex; flex-direction: column; gap: 14px; }
.fd-field { display: flex; flex-direction: column; gap: 4px; }
.fd-sep { border-top: 1px solid var(--grey-rule); margin: 16px 0 0; }
.fd-readonly { color: var(--grey); pointer-events: none; }
.fd-footer {
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;
}

<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── State ──
let nwEditId       = null;
let nwDossierData  = null;
let nwMoRows       = [];
let nwToevRows     = [];
let nwEbHoog = 0, nwEbLaag = 0;
let nwGriffekosten = 0, nwMoGriffekosten = 0;
let nwAdvocaatBedrag = 0, nwAdvocaatBtw = 21;
let nwRvrTariefRows = [], nwRvrPerPunt = 0, nwRvrAdmKosten = 0;
let nwRvrVergoeding = 0, nwCoMediation = 0;
let nwZsFactor    = parseFloat(sessionStorage.getItem('nw_zs_factor'))    || 0.54;
let nwZsCoFactor  = parseFloat(sessionStorage.getItem('nw_zs_co_factor')) || 0.25;
let nwFactLines   = { a: [], b: [] };
let nwIsOPSplit   = false;
let nwSavedFactLines = null, nwFactLinesFresh = null, nwFactConflict = false;
let nwDossierFacturen = [];
let _fdCallback = null;
let _vrijEditId = null, _vrijRichting = 'voordeel';

const MO_ORDER = [
  'Gehuwd/GP zonder kinderen','Gehuwd/GP met kinderen',
  'SW zonder kinderen','SW met kinderen',
  'Ondernemer ZZP','Ondernemer BV',
  'Ouderschapsplan los','Herberekening','Scheiden of blijven',
  'Relatie mediation','Uurtarief',
];
const RECHTBANK_ROWS = new Set([
  'Gehuwd/GP zonder kinderen','Gehuwd/GP met kinderen',
  'SW zonder kinderen','SW met kinderen',
  'Ouderschapsplan los','Herberekening',
]);

// ── Helpers ──
function fmtMoney(v){return new Intl.NumberFormat('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);}
// Parse Dutch or plain numbers:
//   "1.234,56" (Dutch with thousands)  → 1234.56
//   "495,87"   (Dutch, no thousands)   → 495.87
//   "495.87"   (plain/English decimal) → 495.87
//   "1234"     (integer)               → 1234
function parseDutch(s){
  s=(s||'').trim();
  if(!s)return 0;
  if(s.includes('.')&&s.includes(','))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  if(s.includes(','))return parseFloat(s.replace(',','.'))||0;
  return parseFloat(s)||0;
}
function tryParseJSON(v){try{return JSON.parse(v)||{};}catch{return{};}}
function formatAmount(v){if(v==null||v==='')return'—';const n=parseFloat(v);if(isNaN(n))return v;return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
async function signOut(){await db.auth.signOut();window.location.href='index.html';}

function goToDetailsTab(){
  sessionStorage.setItem('nw_zs_factor',    nwZsFactor);
  sessionStorage.setItem('nw_zs_co_factor', nwZsCoFactor);
  if(nwEditId){
    window.location.href = 'factuur-details.html?id='+nwEditId;
  } else if(nwDossierData?.id){
    window.location.href = 'factuur-details.html?dossier_id='+nwDossierData.id;
  } else {
    window.location.href = 'factuur-details.html';
  }
}

// ── Data loading ──
async function loadAllData(factuur){
  nwEditId = factuur.id;
  const savedR = factuur.regels || {};
  nwRvrVergoeding  = savedR.rvr_vergoeding || 0;
  nwCoMediation    = savedR.co_mediation   || 0;
  nwSavedFactLines = savedR.factuur_lines  || null;

  const { data: dos } = await db.from('dossiers')
    .select('id,klant,info_data,toevoeging_a,toevoeging_b,bevestigd_a,bevestigd_b,eigen_bijdrage_a,eigen_bijdrage_b')
    .eq('id', factuur.dossier_id).single();
  nwDossierData = dos;
  document.getElementById('page-title').textContent = dos.klant || 'Factuur';

  // MO period
  const{data:moP}=await db.from('mo_bedragen').select('geldig_van,geldig_tot').order('geldig_tot',{ascending:false});
  const seen={};const moPeriods=[];
  (moP||[]).forEach(r=>{const k=r.geldig_van+'|'+r.geldig_tot;if(!seen[k]){seen[k]=true;moPeriods.push({van:r.geldig_van,tot:r.geldig_tot});}});

  // RvR period matching bevestigd date
  nwEbHoog=0;nwEbLaag=0;nwGriffekosten=0;
  const{data:allEbRows}=await db.from('eigen_bijdragen').select('geldig_van,geldig_tot').order('geldig_tot',{ascending:false});
  const _seenEb={};const ebPeriods=[];
  (allEbRows||[]).forEach(r=>{const k=r.geldig_van+'|'+r.geldig_tot;if(!_seenEb[k]){_seenEb[k]=true;ebPeriods.push({van:r.geldig_van,tot:r.geldig_tot});}});
  const _bev=nwDossierData.bevestigd_a||nwDossierData.bevestigd_b;
  const ebPeriod=ebPeriods.length?(_bev?(ebPeriods.find(p=>p.van<=_bev&&_bev<=p.tot)||ebPeriods[0]):ebPeriods[0]):null;
  if(ebPeriod){
    const{data:ebD}=await db.from('eigen_bijdragen').select('soort,bedrag_incl_btw').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot);
    (ebD||[]).forEach(r=>{if(r.soort==='Hoog')nwEbHoog=parseFloat(r.bedrag_incl_btw)||0;if(r.soort==='Laag')nwEbLaag=parseFloat(r.bedrag_incl_btw)||0;});
    const{data:gkD}=await db.from('griffiekosten').select('bedrag').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot).maybeSingle();
    if(gkD)nwGriffekosten=parseFloat(gkD.bedrag)||0;
    const{data:rvrD}=await db.from('rvr_tarieven').select('*').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot);
    nwRvrTariefRows=rvrD||[];
    if(nwRvrTariefRows.length&&nwRvrTariefRows[0].per_punt!=null){nwRvrPerPunt=parseFloat(nwRvrTariefRows[0].per_punt)||0;nwRvrAdmKosten=parseFloat(nwRvrTariefRows[0].adm)||0;}
  }

  // Load MO bedragen for saved period
  const periodToLoad=(savedR.periode_mo)||(moPeriods.length?moPeriods[0].van+'|'+moPeriods[0].tot:null);
  if(periodToLoad)await loadNwMoBedragen(periodToLoad); else nwMoRows=[];

  // Restore diensten state
  if(savedR.diensten&&Array.isArray(savedR.diensten)){
    applySavedDiensten(savedR.diensten);
    // Refresh advocaat/griffie from the current MO period — saved values may be stale
    // if the period was changed in Details after the factuur was first created.
    const _info=tryParseJSON(nwDossierData.info_data);
    const _heeftRb=((_info._dienstverlening)||{}).rechtbank==='Ja';
    nwMoRows.forEach(row=>{
      if(row.checked&&_heeftRb&&RECHTBANK_ROWS.has(row.omschrijving)){row.advocaat=nwAdvocaatBedrag;row.griffie=nwMoGriffekosten;}
      else{row.advocaat=0;row.griffie=0;}
    });
    computeNwFactLines();
  } else {
    pickNwDiensten();
    computeNwFactLines();
  }
}

// Load calculations for a dossier directly (no existing factuur — "dossier_id" mode)
async function loadAllDataFromDossier(dossierId){
  nwEditId=null;nwRvrVergoeding=0;nwCoMediation=0;nwSavedFactLines=null;
  const{data:dos}=await db.from('dossiers')
    .select('id,klant,info_data,toevoeging_a,toevoeging_b,bevestigd_a,bevestigd_b,eigen_bijdrage_a,eigen_bijdrage_b')
    .eq('id',dossierId).single();
  if(!dos){showToast('Dossier niet gevonden');return;}
  nwDossierData=dos;
  document.getElementById('page-title').textContent=dos.klant||'Factuur';
  const{data:moP}=await db.from('mo_bedragen').select('geldig_van,geldig_tot').order('geldig_tot',{ascending:false});
  const seen={};const moPeriods=[];
  (moP||[]).forEach(r=>{const k=r.geldig_van+'|'+r.geldig_tot;if(!seen[k]){seen[k]=true;moPeriods.push({van:r.geldig_van,tot:r.geldig_tot});}});
  nwEbHoog=0;nwEbLaag=0;nwGriffekosten=0;
  const{data:allEbRows}=await db.from('eigen_bijdragen').select('geldig_van,geldig_tot').order('geldig_tot',{ascending:false});
  const _seenEb={};const ebPeriods=[];
  (allEbRows||[]).forEach(r=>{const k=r.geldig_van+'|'+r.geldig_tot;if(!_seenEb[k]){_seenEb[k]=true;ebPeriods.push({van:r.geldig_van,tot:r.geldig_tot});}});
  const _bev=nwDossierData.bevestigd_a||nwDossierData.bevestigd_b;
  const ebPeriod=ebPeriods.length?(_bev?(ebPeriods.find(p=>p.van<=_bev&&_bev<=p.tot)||ebPeriods[0]):ebPeriods[0]):null;
  if(ebPeriod){
    const{data:ebD}=await db.from('eigen_bijdragen').select('soort,bedrag_incl_btw').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot);
    (ebD||[]).forEach(r=>{if(r.soort==='Hoog')nwEbHoog=parseFloat(r.bedrag_incl_btw)||0;if(r.soort==='Laag')nwEbLaag=parseFloat(r.bedrag_incl_btw)||0;});
    const{data:gkD}=await db.from('griffiekosten').select('bedrag').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot).maybeSingle();
    if(gkD)nwGriffekosten=parseFloat(gkD.bedrag)||0;
    const{data:rvrD}=await db.from('rvr_tarieven').select('*').eq('geldig_van',ebPeriod.van).eq('geldig_tot',ebPeriod.tot);
    nwRvrTariefRows=rvrD||[];
    if(nwRvrTariefRows.length&&nwRvrTariefRows[0].per_punt!=null){nwRvrPerPunt=parseFloat(nwRvrTariefRows[0].per_punt)||0;nwRvrAdmKosten=parseFloat(nwRvrTariefRows[0].adm)||0;}
  }
  // Use period from sessionStorage (set by Details tab) if available, else latest
  const _sessionPeriod=sessionStorage.getItem('period_mo_'+dossierId);
  const periodToLoad=_sessionPeriod||(moPeriods.length?moPeriods[0].van+'|'+moPeriods[0].tot:null);
  if(periodToLoad)await loadNwMoBedragen(periodToLoad); else nwMoRows=[];
  pickNwDiensten();
  computeNwFactLines();
}

async function loadNwMoBedragen(periodKey){
  const[van,tot]=periodKey.split('|');
  const{data}=await db.from('mo_bedragen').select('omschrijving,bedrag_incl_btw').eq('geldig_van',van).eq('geldig_tot',tot).order('id');
  const advRow=(data||[]).find(r=>r.omschrijving==='Advocaatkosten');
  nwAdvocaatBedrag=advRow?parseFloat(advRow.bedrag_incl_btw)||0:0;nwAdvocaatBtw=advRow?parseFloat(advRow.btw_perc)||21:21;
  const gkRow=(data||[]).find(r=>r.omschrijving==='Griffiekosten');nwMoGriffekosten=gkRow?parseFloat(gkRow.bedrag_incl_btw)||0:0;
  const byName={};(data||[]).forEach(r=>{byName[r.omschrijving]=parseFloat(r.bedrag_incl_btw)||0;});
  const EXCLUDED=new Set(['Advocaatkosten','Griffiekosten']);
  nwMoRows=MO_ORDER.filter(name=>name in byName&&!EXCLUDED.has(name)).map(name=>({omschrijving:name,bedrag:byName[name],invoiceBedrag:byName[name],advocaat:0,griffie:0,checked:false,aantal:1}));
}

function pickNwDiensten(){
  if(!nwDossierData)return;
  const info=tryParseJSON(nwDossierData.info_data);const klant=info._klant||{};const dienst=info._dienstverlening||{};
  const type=dienst.type||'',relatie=klant.relatie||'',kinderen=klant.kinderen||'',bedrijf=klant.bedrijf||'',rechtbank=dienst.rechtbank||'';
  const isGehuwd=relatie==='Gehuwd'||relatie==='Geregistreerd Partner';const isSW=relatie==='Samenlevers';
  const metKind=kinderen==='Kinderen <8'||kinderen==='Kinderen >8';const zonderKind=kinderen==='Geen';
  const isScheid=type==='Scheiding';const heeftRechtbank=rechtbank==='Ja';
  nwMoRows.forEach(row=>{
    const n=row.omschrijving;
    row.checked=(n==='Gehuwd/GP zonder kinderen'&&isScheid&&isGehuwd&&zonderKind)||(n==='Gehuwd/GP met kinderen'&&isScheid&&isGehuwd&&metKind)||(n==='SW zonder kinderen'&&isScheid&&isSW&&zonderKind)||(n==='SW met kinderen'&&isScheid&&isSW&&metKind)||(n==='Ondernemer ZZP'&&bedrijf==='ZZP')||(n==='Ondernemer BV'&&bedrijf==='BV')||(n==='Ouderschapsplan los'&&type==='Herziening OP')||(n==='Herberekening'&&type==='Herberekening')||(n==='Scheiden of blijven'&&type==='Scheiden of Blijven')||(n==='Relatie mediation'&&type==='Relatiemediation')||(n==='Uurtarief'&&type==='Uurtarief');
    if(row.checked)row.invoiceBedrag=row.bedrag;
    if(row.checked&&heeftRechtbank&&RECHTBANK_ROWS.has(n)){row.advocaat=nwAdvocaatBedrag;row.griffie=nwMoGriffekosten;}else{row.advocaat=0;row.griffie=0;}
  });
}

function applySavedDiensten(savedDiensten){
  nwMoRows.forEach(row=>{row.checked=false;row.advocaat=0;row.griffie=0;});
  savedDiensten.forEach(saved=>{const row=nwMoRows.find(r=>r.omschrijving===saved.naam);if(!row)return;row.checked=true;row.aantal=saved.aantal!=null?saved.aantal:1;row.invoiceBedrag=saved.bedrag!=null?saved.bedrag:row.bedrag;row.advocaat=saved.advocaat!=null?saved.advocaat:0;row.griffie=saved.griffie!=null?saved.griffie:0;});
}

function nwGetRvrTypeKlant(){
  if(!nwDossierData)return null;
  const info=tryParseJSON(nwDossierData.info_data);const klant=info._klant||{};const dienst=info._dienstverlening||{};
  const type=dienst.type||'',relatie=klant.relatie||'',kinderen=klant.kinderen||'',rechtbank=dienst.rechtbank||'';
  const metKind=kinderen==='Kinderen <8'||kinderen==='Kinderen >8';
  if(type==='Herziening OP'||type==='Herberekening')return'SW kids / OP';
  if(relatie==='Gehuwd')return metKind?'Huwelijk met kinderen':'Huwelijk zonder kinderen';
  if(relatie==='Geregistreerd Partner'){if(metKind)return'GP met kinderen';return rechtbank==='Ja'?'GP zonder kinderen / RB':'GP zonder kinderen / notarieel';}
  if(relatie==='Samenlevers')return metKind?'SW kids / OP':'SW';
  return null;
}

function nwCalcRvrBedrag(typeKlant,subType){
  const row=nwRvrTariefRows.find(r=>r.type_klant===typeKlant&&r.sub_type===subType);
  if(!row)return 0;
  const toev=parseFloat(row.toev)||0,afh=parseFloat(row.afhechting)||0,kp=parseFloat(row.kinderen_punten)||0;
  const adm=subType==='dubbele toevoeging'?nwRvrAdmKosten*2:nwRvrAdmKosten;
  return((toev+afh+kp)*nwRvrPerPunt+adm)*1.21;
}

function computeNwFactLines(){
  if(!nwDossierData){nwFactLines={a:[],b:[]};return;}
  const info=tryParseJSON(nwDossierData.info_data);const klant=info._klant||{};
  const toevA=nwDossierData.toevoeging_a===1,toevB=nwDossierData.toevoeging_b===1;
  const ebSoortA=(nwDossierData.eigen_bijdrage_a||'').toLowerCase(),ebSoortB=(nwDossierData.eigen_bijdrage_b||'').toLowerCase();
  const ebAmtA=ebSoortA==='hoog'?nwEbHoog:ebSoortA==='laag'?nwEbLaag:0;
  const ebAmtB=ebSoortB==='hoog'?nwEbHoog:ebSoortB==='laag'?nwEbLaag:0;
  const hasBedrijf=klant.bedrijf==='ZZP'||klant.bedrijf==='BV';
  const bedrijfRow=nwMoRows.find(r=>r.checked&&(r.omschrijving==='Ondernemer ZZP'||r.omschrijving==='Ondernemer BV'));
  const diensten=nwMoRows.filter(r=>r.checked&&r.omschrijving!=='Ondernemer ZZP'&&r.omschrijving!=='Ondernemer BV');
  const bedrijfPerson=(!toevA&&toevB)?'a':(toevA&&!toevB)?'b':'a';
  const dienst=info._dienstverlening||{};const caseType=dienst.type||'';
  const isOPSplit=caseType==='Herziening OP'||caseType==='Herberekening';nwIsOPSplit=isOPSplit;
  function mk(o,b,t){return{omschrijving:o,bedrag:b,btw:t??21};}
  const dienstenRB=diensten.filter(r=>RECHTBANK_ROWS.has(r.omschrijving));
  const dienstenOtherAll=nwMoRows.filter(r=>r.checked&&!RECHTBANK_ROWS.has(r.omschrijving));
  const totalAdvocaat=dienstenRB.reduce((s,r)=>s+(r.advocaat||0),0);
  const totalMoGriffie=dienstenRB.reduce((s,r)=>s+(r.griffie||0),0);
  function buildLines(side,hasToev,ebAmt){
    const lines=[];const isBedrijf=hasBedrijf&&bedrijfRow&&bedrijfPerson===side;
    function addOther(r,half){const isBr=r.omschrijving==='Ondernemer ZZP'||r.omschrijving==='Ondernemer BV';if(isBr)return;const amt=half?r.invoiceBedrag/2:r.invoiceBedrag;if(amt>0)lines.push(mk(r.omschrijving,amt,r.btw));}
    if(!toevA&&!toevB&&!isOPSplit){
      if(side!=='a')return lines;
      dienstenRB.forEach(r=>{if(r.invoiceBedrag>0)lines.push(mk(r.omschrijving,r.invoiceBedrag,r.btw));});
      if(totalAdvocaat>0)lines.push(mk('Advocaatkosten',totalAdvocaat,nwAdvocaatBtw));
      if(totalMoGriffie>0)lines.push(mk('Griffiekosten',totalMoGriffie,0));
      dienstenOtherAll.forEach(r=>addOther(r,false));
      if(nwRvrVergoeding>0)lines.push(mk('RvR vergoeding',nwRvrVergoeding,21));
      if(nwCoMediation>0)lines.push(mk('Co-mediation',nwCoMediation,21));
      if(isBedrijf)lines.push(mk(bedrijfRow.omschrijving,bedrijfRow.invoiceBedrag,bedrijfRow.btw));
    }else if(!hasToev){
      dienstenRB.forEach(r=>{const h=r.invoiceBedrag/2;if(h>0)lines.push(mk(r.omschrijving,h,r.btw));});
      if(totalAdvocaat>0)lines.push(mk('Advocaatkosten',totalAdvocaat/2,nwAdvocaatBtw));
      if(totalMoGriffie>0)lines.push(mk('Griffiekosten',totalMoGriffie/2,0));
      dienstenOtherAll.forEach(r=>addOther(r,true));
      if(nwCoMediation>0)lines.push(mk('Co-mediation',nwCoMediation/2,21));
      if(isBedrijf)lines.push(mk(bedrijfRow.omschrijving,bedrijfRow.invoiceBedrag,bedrijfRow.btw));
    }else{
      if(ebAmt>0)lines.push(mk('Eigen bijdrage',ebAmt,21));
      if(nwGriffekosten>0&&totalMoGriffie!==0)lines.push(mk('Griffiekosten',nwGriffekosten/2,0));
      if(nwRvrVergoeding>0)lines.push(mk('RvR vergoeding',nwRvrVergoeding,21));
      if(nwCoMediation>0)lines.push(mk('Co-mediation',nwCoMediation/2,21));
      if(isBedrijf)lines.push(mk(bedrijfRow.omschrijving,bedrijfRow.invoiceBedrag,bedrijfRow.btw));
    }
    return lines;
  }
  nwFactLines={a:buildLines('a',toevA,ebAmtA),b:buildLines('b',toevB,ebAmtB)};
}

// ── Equalise column widths within each side column independently ──
function equalizeOmschrijvingWidth(){
  ['fact-col-left','fact-col-right'].forEach(colId=>{
    const col=document.getElementById(colId);if(!col)return;
    const tables=[...col.querySelectorAll('.fact-tbl')];if(!tables.length)return;
    const colCount=5;
    tables.forEach(tbl=>tbl.querySelectorAll('th,td').forEach(c=>c.style.minWidth=''));
    const maxW=new Array(colCount).fill(0);
    tables.forEach(tbl=>{tbl.querySelectorAll('tr').forEach(tr=>{[...tr.querySelectorAll('th,td')].forEach((c,i)=>{if(i<colCount&&c.colSpan===1)maxW[i]=Math.max(maxW[i],c.offsetWidth);});});});
    tables.forEach(tbl=>{tbl.querySelectorAll('tr').forEach(tr=>{[...tr.querySelectorAll('th,td')].forEach((c,i)=>{if(i<colCount&&c.colSpan===1)c.style.minWidth=maxW[i]+'px';});});});
  });
}

function getDossierFactuur(title){
  // Exclude the main factuur being viewed (nwEditId) to prevent accidentally matching/overwriting it
  return nwDossierFacturen.find(f=>f.id!==nwEditId&&f.regels?.sub_label===title&&!f.regels?.vrij)||null;
}
async function loadDossierFacturen(){
  if(!nwDossierData)return;
  const{data}=await db.from('facturen').select('*').eq('dossier_id',nwDossierData.id);
  nwDossierFacturen=data||[];
}
function calcFdTotaal(){
  const excl=parseDutch(document.getElementById('fd-excl').value);
  const btw =parseDutch(document.getElementById('fd-btw').value);
  document.getElementById('fd-totaal').value=fmtMoney(excl+btw);
}
function openFactuurDialog(tableTitle,getAmounts,existingFactuur){
  _fdCallback=async(nr,datum,verval,exclStr,btwStr)=>{
    const calcAmts=getAmounts();
    const exclVal=parseDutch(exclStr);
    const btwVal =parseDutch(btwStr);
    const amount =Math.round((exclVal+btwVal)*100)/100;
    const payload={
      klant:nwDossierData.klant,dossier_id:nwDossierData.id,
      factuurnummer:nr||null,factuurdatum:datum||null,vervaldatum:verval||null,
      bedrag:amount,
      status:existingFactuur?(existingFactuur.status||'open'):'open',
      regels:{
        sub_label:tableTitle,
        bedrag_incl:amount,
        bedrag_excl:exclVal,
        bedrag_btw:btwVal,
        bedrag_incl_calc:Math.round(calcAmts.incl*100)/100,
      },
    };
    if(existingFactuur){
      const{data,error}=await db.from('facturen').update(payload).eq('id',existingFactuur.id).select().single();
      if(error){showToast('Opslaan mislukt: '+error.message);return;}
      const idx=nwDossierFacturen.findIndex(f=>f.id===existingFactuur.id);
      if(idx>=0)nwDossierFacturen[idx]=data;
      showToast('Factuur bijgewerkt');
    }else{
      const{data,error}=await db.from('facturen').insert(payload).select().single();
      if(error){showToast('Opslaan mislukt: '+error.message);return;}
      nwDossierFacturen.push(data);
      showToast('Factuur aangemaakt');
    }
    document.getElementById('factuur-dialog').classList.remove('open');_fdCallback=null;
    rebuildTables();
  };
  // Pre-fill amounts: prefer stored excl/btw on existing factuur, else use calculated
  const calcAmts=getAmounts();
  const fillExcl=existingFactuur?.regels?.bedrag_excl!=null?existingFactuur.regels.bedrag_excl:calcAmts.excl;
  const fillBtw =existingFactuur?.regels?.bedrag_btw !=null?existingFactuur.regels.bedrag_btw :(calcAmts.incl-calcAmts.excl);
  document.getElementById('fd-nr').value=existingFactuur?.factuurnummer||'';
  document.getElementById('fd-datum').value=existingFactuur?.factuurdatum||'';
  document.getElementById('fd-verval').value=existingFactuur?.vervaldatum||'';
  document.getElementById('fd-excl').value=fmtMoney(fillExcl);
  document.getElementById('fd-btw').value=fmtMoney(fillBtw);
  document.getElementById('fd-totaal').value=fmtMoney(fillExcl+fillBtw);
  document.getElementById('fd-title').textContent=(existingFactuur?'Update factuur':'Factuur toevoegen')+' — '+tableTitle;
  document.getElementById('factuur-dialog').classList.add('open');
  setTimeout(()=>document.getElementById('fd-nr').focus(),50);
}
function closeFactuurDialog(){
  document.getElementById('factuur-dialog').classList.remove('open');_fdCallback=null;
}
async function submitFactuurDialog(){
  if(!_fdCallback)return;
  const nr    =document.getElementById('fd-nr').value.trim();
  const datum =document.getElementById('fd-datum').value;
  const verval=document.getElementById('fd-verval').value;
  const excl  =document.getElementById('fd-excl').value;
  const btw   =document.getElementById('fd-btw').value;
  await _fdCallback(nr,datum,verval,excl,btw);
}

function addFactuurOverzicht(container,tableTitle,getAmounts,invertSign){
  const factuur=getDossierFactuur(tableTitle);
  if(!factuur)return;
  const calcAmt=getAmounts().incl;
  const factAmt=factuur.bedrag||0;
  // For inkomende facturen (costs): invert so higher factuur = negative (bad)
  // For uitgaande facturen (income): higher factuur = positive (good)
  const diff=invertSign?(calcAmt-factAmt):(factAmt-calcAmt);
  const hasDiff=Math.abs(diff)>0.01;
  const div=document.createElement('div');
  div.style.cssText='font-family:Nunito,sans-serif;font-size:0.78rem;display:flex;align-items:center;gap:14px;padding:4px 2px 10px;flex-wrap:wrap;';
  const nrSpan=document.createElement('span');
  if(hasDiff){
    nrSpan.style.cssText='font-weight:800;color:#c0392b;background:#FDECEA;border-radius:4px;padding:2px 7px;white-space:nowrap;';
    nrSpan.textContent='⚠ '+(factuur.factuurnummer||'(geen nummer)');
  }else{
    nrSpan.style.cssText='font-weight:700;color:var(--grey-text);white-space:nowrap;';
    nrSpan.textContent='# '+(factuur.factuurnummer||'—');
  }
  div.appendChild(nrSpan);
  const amtSpan=document.createElement('span');
  amtSpan.style.cssText='color:var(--grey-text);font-weight:600;white-space:nowrap;';
  amtSpan.textContent=formatAmount(factAmt);
  div.appendChild(amtSpan);
  if(hasDiff){
    const calcSpan=document.createElement('span');
    calcSpan.style.cssText='color:var(--grey);font-size:0.72rem;white-space:nowrap;';
    calcSpan.textContent='(berekend: '+formatAmount(calcAmt)+')';
    const diffSpan=document.createElement('span');
    diffSpan.style.cssText='font-weight:700;color:'+(diff>0?'#27ae60':'#c0392b')+';white-space:nowrap;';
    diffSpan.textContent='verschil '+(diff>0?'+':'')+formatAmount(diff);
    div.appendChild(calcSpan);
    div.appendChild(diffSpan);
  }
  container.appendChild(div);
}

// ── Automatisch bedrag_incl_calc bijwerken na berekeningswijziging ──
async function autoRefreshCalcAmounts(){
  if(!nwDossierData||!nwDossierFacturen.length)return;
  const AFFECTED=['Vergoedingsfactuur Zorgzaam Scheiden','Uitbetaling vergoedingen toevoegingen'];
  const affected=nwDossierFacturen.filter(f=>AFFECTED.includes(f.regels?.sub_label)&&!f.regels?.vrij);
  if(!affected.length)return;
  const calcMap=computePdfCalcMap();
  for(const f of affected){
    const entry=calcMap[f.regels.sub_label];
    if(!entry)continue;
    const newCalc=Math.round(entry.calcIncl*100)/100;
    if(f.regels?.bedrag_incl_calc!=null&&Math.abs((f.regels.bedrag_incl_calc||0)-newCalc)<=0.005)continue;
    const newRegels={...f.regels,bedrag_incl_calc:newCalc};
    const{data}=await db.from('facturen').update({regels:newRegels}).eq('id',f.id).select().single();
    if(data){const idx=nwDossierFacturen.findIndex(x=>x.id===f.id);if(idx>=0)nwDossierFacturen[idx]=data;}
  }
}

function rebuildTables(){
  const wrap=document.getElementById('fact-tables-wrap');wrap.innerHTML='';
  if(!nwDossierData)return;
  const info=tryParseJSON(nwDossierData.info_data);const klant=info._klant||{};
  const naamA=klant.naam_a||'Persoon A',naamB=klant.naam_b||'Persoon B';
  const toevA=nwDossierData.toevoeging_a===1,toevB=nwDossierData.toevoeging_b===1;

  // Two-column layout
  const colWrap=document.createElement('div');colWrap.style.cssText='display:flex;gap:48px;align-items:flex-start;';
  wrap.appendChild(colWrap);

  // Left: Uitgaande facturen
  const leftCol=document.createElement('div');leftCol.id='fact-col-left';
  const leftTitle=document.createElement('div');leftTitle.className='fact-col-title';leftTitle.textContent='Uitgaande facturen';leftCol.appendChild(leftTitle);
  colWrap.appendChild(leftCol);

  // Right: Inkomende facturen
  const rightCol=document.createElement('div');rightCol.id='fact-col-right';rightCol.style.cssText='display:flex;flex-direction:column;';
  const rightTitle=document.createElement('div');rightTitle.className='fact-col-title';rightTitle.textContent='Inkomende facturen';rightCol.appendChild(rightTitle);
  colWrap.appendChild(rightCol);

  const splitInvoices=toevA||toevB||nwIsOPSplit;
  const titleA=splitInvoices?naamA:(nwDossierData.klant||naamA);
  appendPersonTable(leftCol,titleA,nwFactLines.a,'a');
  // Align first section header with right column (both marginTop: 0)
  const firstLeftHdr=leftCol.querySelector('.nw-sect-hdr');
  if(firstLeftHdr)firstLeftHdr.style.marginTop='0';
  if(splitInvoices)appendPersonTable(leftCol,naamB,nwFactLines.b,'b');
  const uitbetaling=appendUitbetalingVergoedingen(leftCol);
  const zsInkomen=appendZsVergoedingsfactuur(rightCol);
  appendNettoOpbrengst(rightCol,zsInkomen,uitbetaling);
  equalizeOmschrijvingWidth();
  renderVrijeFacturenSection();
  // Align columns: use offsetHeight math — no scroll/viewport dependency
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{
    const L=document.getElementById('fact-col-left');
    const R=document.getElementById('fact-col-right');
    if(!L||!R)return;
    // Returns distance from col's top to el's top edge (incl el's own marginTop)
    function topOf(col,el){
      let s=0;
      for(const c of col.children){
        if(c===el)break;
        const cs=getComputedStyle(c);
        s+=parseFloat(cs.marginTop)||0;
        s+=c.offsetHeight;
        s+=parseFloat(cs.marginBottom)||0;
      }
      return s+(parseFloat(getComputedStyle(el).marginTop)||0);
    }
    // Reset first
    const lHdr=L.querySelector('.nw-sect-hdr');
    const rHdr=R.querySelector('.nw-sect-hdr');
    const nw=document.getElementById('netto-opbrengst-wrap');
    if(lHdr)lHdr.style.marginTop='0';
    if(rHdr)rHdr.style.marginTop='0';
    if(nw)nw.style.marginTop='0';
    // Step 1: align first fact-tbl in each column
    const lTbl=L.querySelector('.fact-tbl');
    const rTbl=R.querySelector('.fact-tbl');
    if(lTbl&&rTbl){
      const d=topOf(R,rTbl)-topOf(L,lTbl);
      if(d>0.5&&lHdr)lHdr.style.marginTop=d+'px';
      else if(d<-0.5&&rHdr)rHdr.style.marginTop=(-d)+'px';
    }
    // Step 2: align netto wrap with uitb section header (re-reads after step 1 changes)
    const uitb=document.getElementById('uitb-sect-hdr');
    if(uitb&&nw){
      const delta=topOf(L,uitb)-topOf(R,nw);
      if(Math.abs(delta)>0.5)nw.style.marginTop=Math.max(0,delta)+'px';
    }
  });
  // Stil op de achtergrond: bijgewerkte berekening opslaan voor beide factuurtypen
  autoRefreshCalcAmounts();
}

  const toevA=nwDossierData.toevoeging_a===1,toevB=nwDossierData.toevoeging_b===1;
  const splitInvoices=toevA||toevB||nwIsOPSplit;

  function personTotals(lines){
    return (lines||[]).reduce((s,l)=>{const b=l.btw??21;const incl=l.bedrag||0;const excl=incl/(1+b/100);return{incl:s.incl+incl,excl:s.excl+excl};},{incl:0,excl:0});
  }
  const tA=personTotals(nwFactLines.a),tB=personTotals(nwFactLines.b);
  const zsI=zsInkomen||{incl:0,excl:0},uitb=uitbetaling||{incl:0,excl:0};

  const nettoIncl=tA.incl+tB.incl+uitb.incl-zsI.incl;
  const nettoExcl=tA.excl+tB.excl+uitb.excl-zsI.excl;
  const nettoBtw=nettoIncl-nettoExcl;

  const wrap=document.createElement('div');
  wrap.id='netto-opbrengst-wrap';
  wrap.style.cssText='background:var(--orange-soft);border-radius:6px;padding:14px 16px;margin-top:0;';

  const title=document.createElement('div');
  title.style.cssText='font-family:Nunito,sans-serif;font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--orange-dark);margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid var(--orange);';
  title.textContent='Totaal';wrap.appendChild(title);

  const tbl=document.createElement('table');tbl.style.cssText='white-space:nowrap;border-collapse:collapse;width:100%;font-family:Nunito,sans-serif;font-size:0.82rem;';
  const thead=document.createElement('thead');
  const hRow=document.createElement('tr');
  [['Omschrijving','left'],['Bedrag excl BTW','right'],['BTW','right'],['Totaal','right']].forEach(([txt,align])=>{
    const th=document.createElement('th');th.style.cssText=`padding:2px ${align==='right'?'0':'12px'} 6px ${align==='right'?'12px':'0'};text-align:${align};font-size:0.70rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--orange-dark);border-bottom:1px solid var(--orange);`;th.textContent=txt;hRow.appendChild(th);
  });thead.appendChild(hRow);tbl.appendChild(thead);
  const tbody=document.createElement('tbody');

  function addNRow(label,excl,btw,incl){
    const isNeg=incl<0;const clr=isNeg?'#c0392b':'var(--ink)';const gclr=isNeg?'#c0392b':'var(--grey-text)';
    const tr=document.createElement('tr');
    const tdN=document.createElement('td');tdN.style.cssText='padding:3px 12px 3px 0;font-weight:600;color:var(--grey-text);';tdN.textContent=label;
    const tdE=document.createElement('td');tdE.style.cssText=`padding:3px 0 3px 12px;text-align:right;color:${gclr};font-weight:600;white-space:nowrap;`;tdE.textContent=excl<0?'− '+formatAmount(-excl):formatAmount(excl);
    const tdB=document.createElement('td');tdB.style.cssText=`padding:3px 0 3px 12px;text-align:right;color:${gclr};font-weight:600;white-space:nowrap;`;tdB.textContent=btw<0?'− '+formatAmount(-btw):formatAmount(btw);
    const tdV=document.createElement('td');tdV.style.cssText=`padding:3px 0 3px 12px;text-align:right;font-weight:700;color:${clr};white-space:nowrap;`;tdV.textContent=incl<0?'− '+formatAmount(-incl):formatAmount(incl);
    tr.appendChild(tdN);tr.appendChild(tdE);tr.appendChild(tdB);tr.appendChild(tdV);tbody.appendChild(tr);
  }

  if(splitInvoices){
    if(tA.incl)addNRow(naamA,tA.excl,tA.incl-tA.excl,tA.incl);
    if(tB.incl)addNRow(naamB,tB.excl,tB.incl-tB.excl,tB.incl);
  } else {
    if(tA.incl)addNRow(naamA,tA.excl,tA.incl-tA.excl,tA.incl);
  }
  if(uitb.incl)addNRow('Uitbetaling vergoedingen toevoegingen',uitb.excl,uitb.incl-uitb.excl,uitb.incl);
  if(zsI.incl)addNRow('Vergoedingsfactuur Zorgzaam Scheiden',-zsI.excl,-(zsI.incl-zsI.excl),-zsI.incl);
  tbl.appendChild(tbody);

  const tfoot=document.createElement('tfoot');const fRow=document.createElement('tr');
  const bs='border-top:2px solid var(--orange);padding-top:6px;font-weight:800;font-size:0.88rem;';
  const clr=nettoIncl<0?'#c0392b':'var(--ink)';
  [{v:'Netto Berekend Resultaat',s:bs+'padding-right:12px;color:var(--ink);'},{v:nettoExcl<0?'− '+formatAmount(-nettoExcl):formatAmount(nettoExcl),s:bs+'text-align:right;padding-left:12px;color:'+clr+';white-space:nowrap;'},{v:nettoBtw<0?'− '+formatAmount(-nettoBtw):formatAmount(nettoBtw),s:bs+'text-align:right;padding-left:12px;color:'+clr+';white-space:nowrap;'},{v:nettoIncl<0?'− '+formatAmount(-nettoIncl):formatAmount(nettoIncl),s:bs+'text-align:right;padding-left:12px;color:'+clr+';white-space:nowrap;'}].forEach(({v,s})=>{const td=document.createElement('td');td.style.cssText=s;td.textContent=v;fRow.appendChild(td);});
  tfoot.appendChild(fRow);tbl.appendChild(tfoot);
  wrap.appendChild(tbl);container.appendChild(wrap);
}

// ── Vrije facturen ──
function setVrijRichting(r){
  _vrijRichting=r;
  document.getElementById('vrij-btn-voordeel').className='vrij-seg-btn'+(r==='voordeel'?' is-voordeel':'');
  document.getElementById('vrij-btn-nadeel').className='vrij-seg-btn'+(r==='nadeel'?' is-nadeel':'');
}

function calcVrijTotaal(){
  const excl=parseDutch(document.getElementById('vrij-excl').value);
  const btw =parseDutch(document.getElementById('vrij-btw').value);
  document.getElementById('vrij-totaal').value=fmtMoney(excl+btw);
}

function openVrijModal(existing){
  _vrijEditId=existing?.id||null;
  document.getElementById('vrij-modal-title').textContent=existing?'Vrije factuur bewerken':'Vrije factuur toevoegen';
  document.getElementById('vrij-omschr').value=existing?.regels?.sub_label||'';
  document.getElementById('vrij-nr').value=existing?.factuurnummer||'';
  document.getElementById('vrij-datum').value=existing?.factuurdatum||new Date().toISOString().slice(0,10);
  document.getElementById('vrij-verval').value=existing?.vervaldatum||'';
  // Herstel excl/btw uit opgeslagen regels, of bereken terug uit totaal
  const savedExcl=existing?.regels?.bedrag_excl;
  const savedBtw =existing?.regels?.bedrag_btw;
  const fillExcl=savedExcl!=null?savedExcl:(existing?.bedrag!=null?parseFloat(existing.bedrag)/1.21:0);
  const fillBtw =savedBtw!=null?savedBtw:(existing?.bedrag!=null?parseFloat(existing.bedrag)-parseFloat(existing.bedrag)/1.21:0);
  document.getElementById('vrij-excl').value=fillExcl>0?fmtMoney(fillExcl):'';
  document.getElementById('vrij-btw').value=fillBtw>0?fmtMoney(fillBtw):'';
  document.getElementById('vrij-totaal').value=(fillExcl+fillBtw)>0?fmtMoney(fillExcl+fillBtw):'';
  document.getElementById('vrij-status').value=existing?.status||'open';
  document.getElementById('vrij-opm').value=existing?.regels?.opmerkingen||'';
  document.getElementById('vrij-delete-wrap').style.display=existing?'block':'none';
  setVrijRichting(existing?.regels?.richting||'voordeel');
  document.getElementById('vrij-modal').classList.add('open');
  setTimeout(()=>document.getElementById('vrij-omschr').focus(),50);
}

function closeVrijModal(){
  document.getElementById('vrij-modal').classList.remove('open');
  _vrijEditId=null;
}

async function submitVrijFactuur(){
  const omschr=document.getElementById('vrij-omschr').value.trim();
  if(!omschr){showToast('Vul een omschrijving in');return;}
  const exclVal=parseDutch(document.getElementById('vrij-excl').value);
  const btwVal =parseDutch(document.getElementById('vrij-btw').value);
  const totaal =Math.round((exclVal+btwVal)*100)/100||null;
  const payload={
    klant:nwDossierData.klant, dossier_id:nwDossierData.id,
    factuurnummer:document.getElementById('vrij-nr').value.trim()||null,
    factuurdatum:document.getElementById('vrij-datum').value||null,
    vervaldatum:document.getElementById('vrij-verval').value||null,
    bedrag:totaal,
    status:document.getElementById('vrij-status').value,
    regels:{vrij:true, sub_label:omschr, richting:_vrijRichting,
            bedrag_excl:exclVal||null, bedrag_btw:btwVal||null,
            opmerkingen:document.getElementById('vrij-opm').value.trim()||null},
  };
  if(_vrijEditId){
    const{data,error}=await db.from('facturen').update(payload).eq('id',_vrijEditId).select().single();
    if(error){showToast('Opslaan mislukt: '+error.message);return;}
    const idx=nwDossierFacturen.findIndex(f=>f.id===_vrijEditId);
    if(idx>=0)nwDossierFacturen[idx]=data;
    showToast('Factuur bijgewerkt');
  }else{
    const{data,error}=await db.from('facturen').insert(payload).select().single();
    if(error){showToast('Opslaan mislukt: '+error.message);return;}
    nwDossierFacturen.push(data);
    showToast('Factuur aangemaakt');
  }
  closeVrijModal();
  renderVrijeFacturenSection();
}

async function deleteVrijeFactuur(){
  if(!_vrijEditId||!confirm('Verwijder deze vrije factuur?'))return;
  const{error}=await db.from('facturen').delete().eq('id',_vrijEditId);
  if(error){showToast('Verwijderen mislukt: '+error.message);return;}
  nwDossierFacturen=nwDossierFacturen.filter(f=>f.id!==_vrijEditId);
  closeVrijModal();
  renderVrijeFacturenSection();
  showToast('Factuur verwijderd');
}

function renderVrijeFacturenSection(){
  const wrap=document.getElementById('fact-tables-wrap');if(!wrap)return;
  const old=document.getElementById('vrije-fact-sect');if(old)old.remove();
  const vrijeFacturen=nwDossierFacturen.filter(f=>f.regels?.vrij===true);
  const sect=document.createElement('div');sect.id='vrije-fact-sect';sect.style.marginTop='36px';

  // Header met knop
  const hdr=document.createElement('div');hdr.className='nw-sect-hdr';
  hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:0;';
  const hdrTxt=document.createElement('span');hdrTxt.textContent='Overige facturen';
  const addBtn=document.createElement('button');addBtn.className='btn btn-ghost';
  addBtn.style.cssText='font-size:0.70rem;padding:2px 10px;height:auto;line-height:1.5;white-space:nowrap;text-transform:none;letter-spacing:0;';
  addBtn.textContent='+ Vrije factuur toevoegen';addBtn.onclick=()=>openVrijModal(null);
  hdr.appendChild(hdrTxt);hdr.appendChild(addBtn);sect.appendChild(hdr);

  if(!vrijeFacturen.length){
    const p=document.createElement('p');
    p.style.cssText='font-size:0.78rem;color:var(--grey);padding:8px 2px;font-family:Nunito,sans-serif;';
    p.textContent='Nog geen vrije facturen aangemaakt.';sect.appendChild(p);
  }else{
    const fmtD=v=>v?new Date(v).toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
    const tbl=document.createElement('table');tbl.className='fact-tbl';tbl.style.cssText='margin-bottom:6px;white-space:nowrap;';
    const thead=document.createElement('thead');
    thead.innerHTML='<tr><th class="th-l">Omschrijving</th><th>Factuurnummer</th><th>Datum</th><th>Vervaldatum</th><th>Bedrag</th><th>Voordeel/Nadeel</th><th>Status</th><th></th></tr>';
    tbl.appendChild(thead);
    const tbody=document.createElement('tbody');
    vrijeFacturen.forEach(f=>{
      const isVoordeel=(f.regels?.richting||'voordeel')!=='nadeel';
      const vClrBg=isVoordeel?'#E8F5E9':'#FDECEA',vClrTxt=isVoordeel?'#27ae60':'#c0392b';
      const sClrBg=f.status==='betaald'?'#E8F5E9':'#FFF3E0',sClrTxt=f.status==='betaald'?'#27ae60':'#c96800';
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="td-l" style="font-weight:700">${f.regels?.sub_label||'—'}</td>
        <td>${f.factuurnummer||'—'}</td>
        <td>${fmtD(f.factuurdatum)}</td>
        <td>${fmtD(f.vervaldatum)}</td>
        <td style="font-weight:700">${f.bedrag!=null?formatAmount(f.bedrag):'—'}</td>
        <td><span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:0.70rem;font-weight:800;background:${vClrBg};color:${vClrTxt};">${isVoordeel?'↑ Voordeel':'↓ Nadeel'}</span></td>
        <td><span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:0.70rem;font-weight:700;background:${sClrBg};color:${sClrTxt};">${f.status==='betaald'?'Betaald':'Open'}</span></td>
        <td></td>`;
      const tdBtn=tr.querySelector('td:last-child');
      const btn=document.createElement('button');btn.className='btn btn-ghost';
      btn.style.cssText='font-size:0.70rem;padding:2px 10px;height:auto;line-height:1.5;';
      btn.textContent='Bewerken';btn.onclick=()=>openVrijModal(f);
      tdBtn.appendChild(btn);tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);sect.appendChild(tbl);
  }
  wrap.appendChild(sect);
}

  // Replace fact-inp-sm inputs with static spans (no interactive widgets in PDF)

}

  w.document.write(html);

  // Align two-column layout using PDF font sizes, then print
  let _printed=false;
  function _pdfPrint(){
    if(_printed)return; _printed=true;
    try{
      const wL=w.document.getElementById('fact-col-left');
      const wR=w.document.getElementById('fact-col-right');
      if(wL&&wR){
        function pdfTopOf(col,el){
          let s=0;
          for(const c of col.children){
            if(c===el)break;
            const cs=w.getComputedStyle(c);
            s+=parseFloat(cs.marginTop)||0;
            s+=c.offsetHeight;
            s+=parseFloat(cs.marginBottom)||0;
          }

        const lHdr=wL.querySelector('.nw-sect-hdr');

        if(uitb&&nw){
          const delta=pdfTopOf(wL,uitb)-pdfTopOf(wR,nw);
          if(Math.abs(delta)>0.5)nw.style.marginTop=Math.max(0,delta)+'px';
        }
      }
    }catch(e){}
    try{ w.focus(); w.print(); }catch(e){}
  }
  (w.document.fonts&&w.document.fonts.ready||Promise.resolve()).then(_pdfPrint);
  setTimeout(_pdfPrint,1200); // fallback als fonts.ready niet vuurt
}

function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildPdfDetailHTML() {
  if (!nwDossierData) return '';
  const info = tryParseJSON(nwDossierData.info_data); const kl = info._klant || {};
  const fmtD = v => v ? new Date(v).toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  let dienstHTML = '', toevHTML = '', rvrUitkHTML = '';

  // ── Diensten — alle rijen tonen (incl. niet-aangevinkte), net als op het scherm ──
  if (!nwMoRows.length) {
    dienstHTML = '<p style="font-size:8pt;color:#888;padding:8px 0;">Geen diensten beschikbaar</p>';
  } else {
    let totalDiensten = 0;
    const bodyRows = nwMoRows.map(r => {
      const showRb = RECHTBANK_ROWS.has(r.omschrijving);
      const rowTot = r.checked ? (r.invoiceBedrag||0) + (r.advocaat||0) + (r.griffie||0) : 0;
      if (r.checked) totalDiensten += rowTot;
      const dim = r.checked ? '' : 'opacity:0.36;';
      return `<tr style="${dim}">
        <td class="td-l">${r.checked ? '✓ ' : ''}${_esc(r.omschrijving)}</td>
        <td>${r.checked && r.omschrijving==='Uurtarief' ? (r.aantal||1) : '—'}</td>
        <td>${r.checked ? formatAmount(r.invoiceBedrag||0) : ''}</td>
        <td>${r.checked && showRb && r.advocaat ? formatAmount(r.advocaat) : '—'}</td>
        <td>${r.checked && showRb && r.griffie ? formatAmount(r.griffie) : '—'}</td>
        <td style="font-weight:800">${r.checked ? formatAmount(rowTot) : ''}</td>
      </tr>`;
    }).join('');
    dienstHTML = `<table class="fact-tbl" style="margin-bottom:6px;">
      <thead><tr>
        <th class="th-l">Dienst</th><th>Aantal</th><th>Bedrag</th><th>Advocaat</th><th>Griffie</th><th>Totaal</th>
      </tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot><tr>
        <td colspan="5" style="text-align:right;font-size:6.5pt;font-weight:700;color:#888;">Totaal</td>
        <td style="font-weight:800">${formatAmount(totalDiensten)}</td>
      </tr></tfoot>
    </table>`;
  }

  // ── Toevoegingen ──
  const toevRows = [];
  [[nwDossierData.toevoeging_a, nwDossierData.bevestigd_a, nwDossierData.eigen_bijdrage_a, kl.naam_a||'Persoon A'],
   [nwDossierData.toevoeging_b, nwDossierData.bevestigd_b, nwDossierData.eigen_bijdrage_b, kl.naam_b||'Persoon B']]
  .forEach(([toev, bevestigd, eb, naam]) => {
    if (toev !== 1) return;
    const soort = (eb||'').toLowerCase();
    const bedrag = soort==='hoog'?nwEbHoog:soort==='laag'?nwEbLaag:0;
    toevRows.push({naam, datum:bevestigd, soort:eb||'', bedrag});
  });
  if (toevRows.length) {
    const rows = toevRows.map(r => `<tr>
      <td class="td-l">${_esc(r.naam)}</td>
      <td>${fmtD(r.datum)}</td>
      <td>${r.soort?r.soort.charAt(0).toUpperCase()+r.soort.slice(1):'—'}</td>
      <td style="font-weight:800">${r.bedrag>0?formatAmount(r.bedrag):'—'}</td>
    </tr>`).join('');
    toevHTML = `<div class="nw-sect-hdr" style="margin-top:14px;">Toevoegingen</div>
    <table class="fact-tbl" style="margin-bottom:6px;">
      <thead><tr>
        <th class="th-l">Persoon</th><th>Datum toegekend</th><th>Eigen bijdrage</th><th>Bedrag</th>
      </tr></thead>
      <tbody>${rows}</tbody>

  // ── RvR uitkeringen ──
  rvrUitkHTML = buildPdfRvrUitkHTML();

  // Layout: diensten left (wider), toevoegingen + RvR right — mirrors the Details screen
  const sideContent = toevHTML + (rvrUitkHTML ? `<div class="nw-sect-hdr" style="margin-top:${toevHTML?'14px':'0'};">RvR uitkeringen (incl BTW)</div>${rvrUitkHTML}` : '');
  if (sideContent) {
    return `<div class="detail-cols">
      <div class="detail-col-main">
        <div class="nw-sect-hdr" style="margin-top:0;">Diensten (incl BTW)</div>
        ${dienstHTML}
      </div>
      <div class="detail-col-side">${sideContent}</div>
    </div>`;
  }
  return `<div class="nw-sect-hdr" style="margin-top:0;">Diensten (incl BTW)</div>${dienstHTML}`;
}

function buildPdfRvrUitkHTML() {
  if (!nwDossierData) return '';
  const toevA = nwDossierData.toevoeging_a === 1, toevB = nwDossierData.toevoeging_b === 1;
  if (!toevA && !toevB) return '';
  const info = tryParseJSON(nwDossierData.info_data); const kl = info._klant || {};
  const bothToev = toevA && toevB;
  const typeKlant = nwGetRvrTypeKlant();
  const subType = bothToev ? 'dubbele toevoeging' : 'enkele toevoeging';
  const fullBedrag = nwCalcRvrBedrag(typeKlant, subType);
  const rvrPerP = bothToev ? fullBedrag / 2 : fullBedrag;
  const rows = [];
  if (toevA) { const s=(nwDossierData.eigen_bijdrage_a||'').toLowerCase(); const eb=s==='hoog'?nwEbHoog:s==='laag'?nwEbLaag:0; rows.push({naam:kl.naam_a||'Persoon A',rvr:rvrPerP,eb,tot:rvrPerP-eb}); }
  if (toevB) { const s=(nwDossierData.eigen_bijdrage_b||'').toLowerCase(); const eb=s==='hoog'?nwEbHoog:s==='laag'?nwEbLaag:0; rows.push({naam:kl.naam_b||'Persoon B',rvr:rvrPerP,eb,tot:rvrPerP-eb}); }
  let totRvr=0,totEb=0,totTot=0;
  const body = rows.map(r => { totRvr+=r.rvr; totEb+=r.eb; totTot+=r.tot;
    return `<tr><td class="td-l">${_esc(r.naam)}</td><td>${formatAmount(r.rvr)}</td><td>${r.eb>0?'− '+formatAmount(r.eb):'—'}</td><td style="font-weight:800">${formatAmount(r.tot)}</td></tr>`;
  }).join('');
  return `<table class="fact-tbl" style="margin-bottom:8px;">
  <thead><tr><th class="th-l">Persoon</th><th>RvR</th><th>-Eigen bijdrage</th><th>Totaal</th></tr></thead>
  <tbody>${body}</tbody>
  <tfoot><tr><td style="text-align:right;font-size:6.5pt;font-weight:700;color:#888;">Totaal</td><td style="font-weight:800">${formatAmount(totRvr)}</td><td style="font-weight:800">${totEb>0?'− '+formatAmount(totEb):'—'}</td><td style="font-weight:800">${formatAmount(totTot)}</td></tr></tfoot>
</table>`;
}

// Bereken verwachte bedragen per sub_label (zelfde logica als de render-functies)
function computePdfCalcMap() {
  if (!nwDossierData) return {};
  const map = {};
  const info = tryParseJSON(nwDossierData.info_data); const kl = info._klant || {};
  const toevA = nwDossierData.toevoeging_a === 1, toevB = nwDossierData.toevoeging_b === 1;
  const splitInvoices = toevA || toevB || nwIsOPSplit;

  // Persoon A
  const titleA = splitInvoices ? (kl.naam_a||'Persoon A') : (nwDossierData.klant||(kl.naam_a||'Persoon A'));
  const calcA = nwFactLines.a.reduce((s,l)=>s+(l.bedrag||0), 0);
  if (calcA > 0.01) map[titleA] = {calcIncl: calcA, invertSign: false};

  // Persoon B (alleen bij split)
  if (splitInvoices) {
    const titleB = kl.naam_b || 'Persoon B';
    const calcB = nwFactLines.b.reduce((s,l)=>s+(l.bedrag||0), 0);
    if (calcB > 0.01) map[titleB] = {calcIncl: calcB, invertSign: false};
  }

  // Vergoedingsfactuur ZS — repliceert appendZsVergoedingsfactuur
  const checkedAll = nwMoRows.filter(r=>r.checked);
  const dienstIncl = checkedAll.reduce((s,r)=>s+(r.invoiceBedrag||0), 0);
  const nToev = (toevA?1:0)+(toevB?1:0);
  const ebSoortA = (nwDossierData.eigen_bijdrage_a||'').toLowerCase();
  const ebSoortB = (nwDossierData.eigen_bijdrage_b||'').toLowerCase();
  const ebAmtA = ebSoortA==='hoog'?nwEbHoog:ebSoortA==='laag'?nwEbLaag:0;
  const ebAmtB = ebSoortB==='hoog'?nwEbHoog:ebSoortB==='laag'?nwEbLaag:0;
  const bothToev = toevA && toevB;
  const rvrFull = nwCalcRvrBedrag(nwGetRvrTypeKlant(), bothToev?'dubbele toevoeging':'enkele toevoeging');
  const rvrPerP = bothToev ? rvrFull/2 : rvrFull;
  const uitbA = toevA ? rvrPerP-ebAmtA : 0;
  const uitbB = toevB ? rvrPerP-ebAmtB : 0;
  let basis = 0;
  if (nToev===0) basis=dienstIncl;
  else if (nToev===1) { basis=dienstIncl/2+rvrPerP; }
  else basis=rvrPerP*2;
  const feeIncl = basis*nwZsFactor;
  const adIncl = checkedAll.reduce((s,r)=>s+(r.advocaat||0), 0);
  const gkIncl = [...nwFactLines.a,...nwFactLines.b].filter(l=>l.omschrijving==='Griffiekosten').reduce((s,l)=>s+(l.bedrag||0), 0);
  const coFee = ([...nwFactLines.a,...nwFactLines.b].filter(l=>l.omschrijving==='Co-mediation').reduce((s,l)=>s+(l.bedrag||0), 0)) * nwZsCoFactor;
  const zsTotal = feeIncl+(gkIncl>0?gkIncl:0)+(adIncl>0?adIncl:0)+(coFee>0?coFee:0);
  if (zsTotal > 0.01) map['Vergoedingsfactuur Zorgzaam Scheiden'] = {calcIncl: zsTotal, invertSign: true};

  // Uitbetaling vergoedingen toevoegingen — repliceert appendUitbetalingVergoedingen
  if (nToev > 0) {
    const dienstFull = checkedAll.reduce((s,r)=>s+(r.invoiceBedrag||0), 0);
    const di = nToev===1 ? dienstFull/2 : dienstFull;
    const singleEB = toevA ? ebAmtA : ebAmtB;
    const coSub = nToev===1
      ? (di+(toevA?uitbA:uitbB)+singleEB)
      : (uitbA+uitbB+ebAmtA+ebAmtB);
    const netIncl = (uitbA+uitbB) - (coSub-coSub*nwZsFactor)*nwZsCoFactor;
    if (Math.abs(netIncl) > 0.01) map['Uitbetaling vergoedingen toevoegingen'] = {calcIncl: netIncl, invertSign: false};
  }

  return map;
}

function buildPdfFacturenHTML() {
  if (!nwDossierFacturen.length)
    return '<p style="font-size:8pt;color:#888;padding:8px 0;">Geen facturen aangemaakt</p>';
  const fmtD = v => v ? new Date(v).toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  const calcMap = computePdfCalcMap();
  // ── Per-rij data + totalen in één pas ──
  let sumBedrag=0,sumExcl=0,sumBtw=0,sumBerekendIncl=0,sumExclBerekend=0,sumBtwBerekend=0,sumVerschil=0;
  let cntBetaald=0,cntOpen=0,cntVerlopen=0;

  const rows = nwDossierFacturen.map(f => {
    const lbl = f.regels?.sub_label || f.klant || '—';
    const sCls = f.status==='betaald'?'pill-betaald':'pill-open';
    const sLbl = f.status ? f.status.charAt(0).toUpperCase()+f.status.slice(1) : 'Open';
    const factAmt = f.bedrag != null ? parseFloat(f.bedrag) : null;
    const isIncoming = f.regels?.sub_label==='Vergoedingsfactuur Zorgzaam Scheiden';
    const sign = isIncoming ? -1 : 1;
    let berExclCell='—', berBtwCell='—', berTotCell='—', verschilCell='', rowStyle='';

    // Excl BTW / BTW per rij (werkelijk gefactureerd)
    const fa = factAmt ?? 0;
    const exclV = f.regels?.vrij ? (f.regels.bedrag_excl ?? fa/1.21) : fa/1.21;
    const btwV  = f.regels?.vrij ? (f.regels.bedrag_btw  ?? fa-fa/1.21) : fa-fa/1.21;
    sumBedrag += fa * sign;
    sumExcl   += exclV * sign;
    sumBtw    += btwV  * sign;

    // Status-telling
    const isVerl=f.status!=='betaald'&&f.vervaldatum&&new Date(f.vervaldatum)<new Date();
    const eff=isVerl?'verlopen':(f.status||'open');
    if(eff==='betaald') cntBetaald++;
    else if(eff==='verlopen') cntVerlopen++;
    else cntOpen++;

    if (f.regels?.vrij) {
      const isVoordeel = (f.regels?.richting || 'voordeel') !== 'nadeel';
      const clr = isVoordeel ? '#27ae60' : '#c0392b';
      const arrow = isVoordeel ? '↑ ' : '↓ ';
      berExclCell = ''; berBtwCell = ''; berTotCell = '';
      verschilCell = factAmt != null ? `<span style="font-weight:800;color:${clr}">${arrow}${formatAmount(factAmt)}</span>` : '';
      if (!isVoordeel) rowStyle = 'background:#FDECEA;';
      // Vrije facturen tellen mee in Verschil, maar NIET in Berekend
      // (er is geen systeem-berekend equivalent; de cellen blijven leeg)
      sumVerschil += fa * (isVoordeel ? 1 : -1);
    } else {
      const entry = calcMap[lbl];
      if (entry) {
        // Berekend-kolommen per rij
        const bExclRaw = entry.calcIncl / 1.21;
        const bBtwRaw  = entry.calcIncl - bExclRaw;
        const negF = v => `<span style="color:#c0392b">− ${formatAmount(v)}</span>`;
        if (entry.invertSign) {
          berExclCell = negF(bExclRaw);
          berBtwCell  = negF(bBtwRaw);
          berTotCell  = negF(entry.calcIncl);
        } else {
          berExclCell = formatAmount(bExclRaw);
          berBtwCell  = formatAmount(bBtwRaw);
          berTotCell  = formatAmount(entry.calcIncl);
        }
        const bIncl = entry.calcIncl * (entry.invertSign ? -1 : 1);
        sumBerekendIncl += bIncl;
        sumExclBerekend += bIncl / 1.21;
        sumBtwBerekend  += bIncl - bIncl / 1.21;
        if (factAmt != null) {
          const diff = entry.invertSign ? entry.calcIncl - factAmt : factAmt - entry.calcIncl;
          const hasDiff = Math.abs(diff) > 0.01;
          if (hasDiff) {
            const clr = diff > 0 ? '#27ae60' : '#c0392b';
            verschilCell = `<span style="font-weight:800;color:${clr}">${diff>0?'+':''}${formatAmount(diff)}</span>`;
            if (diff < 0) rowStyle = 'background:#FDECEA;';
            sumVerschil += diff;
          } else {
            verschilCell = '<span style="color:#27ae60;font-weight:700">✓</span>';
          }
        }
      }
    }

    // Vrije nadeel facturen tonen ook rood/negatief in de bedrag-kolommen
    const isNadeel = f.regels?.vrij && (f.regels?.richting || 'voordeel') === 'nadeel';
    const showNeg  = isIncoming || isNadeel;
    const negFmt   = (v) => `<span style="color:#c0392b">− ${formatAmount(v)}</span>`;
    const exclDisp = factAmt!=null ? (showNeg ? negFmt(exclV) : formatAmount(exclV)) : '—';
    const btwDisp  = factAmt!=null ? (showNeg ? negFmt(btwV)  : formatAmount(btwV))  : '—';
    const totDisp  = factAmt!=null ? (showNeg
      ? `<span style="color:#c0392b;font-weight:700">− ${formatAmount(factAmt)}</span>`
      : `<span style="font-weight:700">${formatAmount(factAmt)}</span>`) : '—';

    return `<tr style="${rowStyle}">
      <td class="td-l">${_esc(lbl)}</td>
      <td>${_esc(f.factuurnummer||'—')}</td>
      <td>${fmtD(f.factuurdatum)}</td>
      <td>${fmtD(f.vervaldatum)}</td>
      <td>${exclDisp}</td>
      <td>${btwDisp}</td>
      <td>${totDisp}</td>
      <td>${berExclCell}</td>
      <td>${berBtwCell}</td>
      <td>${berTotCell}</td>
      <td>${verschilCell}</td>
      <td><span class="pill ${sCls}">${sLbl}</span></td>
      <td>${fmtD(f.betaaldatum)}</td>
    </tr>`;
  }).join('');

  // ── Tfoot-totaalrij ──
  const vClr=sumVerschil>0.005?'#27ae60':sumVerschil<-0.005?'#c0392b':'#555';
  const vPfx=sumVerschil>0.005?'+':'';
  const statParts=[];
  if(cntBetaald)  statParts.push(`${cntBetaald}× betaald`);
  if(cntOpen)     statParts.push(`${cntOpen}× open`);
  if(cntVerlopen) statParts.push(`${cntVerlopen}× verlopen`);
  // Gefactureerd totalen (werkelijk)
  const exclTot    = sumExcl<-0.005        ? `<span style="color:#c0392b">− ${formatAmount(-sumExcl)}</span>`           : formatAmount(sumExcl);
  const btwTot     = sumBtw<-0.005         ? `<span style="color:#c0392b">− ${formatAmount(-sumBtw)}</span>`            : formatAmount(sumBtw);
  const bedTot     = sumBedrag<-0.005      ? `<span style="color:#c0392b">− ${formatAmount(-sumBedrag)}</span>`         : formatAmount(sumBedrag);
  // Berekend totalen
  const exclBerTot = sumExclBerekend<-0.005 ? `<span style="color:#c0392b">− ${formatAmount(-sumExclBerekend)}</span>` : formatAmount(sumExclBerekend);
  const btwBerTot  = sumBtwBerekend<-0.005  ? `<span style="color:#c0392b">− ${formatAmount(-sumBtwBerekend)}</span>`  : formatAmount(sumBtwBerekend);
  const berTot     = sumBerekendIncl<-0.005 ? `<span style="color:#c0392b">− ${formatAmount(-sumBerekendIncl)}</span>` : formatAmount(sumBerekendIncl);
  const verTot     = Math.abs(sumVerschil)>=0.005 ? `<span style="color:${vClr};font-weight:800">${vPfx}${formatAmount(sumVerschil)}</span>` : '';

  const tfBg  = 'background:#fff3e0;border-top:2pt solid #F7931E;font-weight:800;';
  const tfLbl = 'background:#fff3e0;border-top:2pt solid #F7931E;font-size:6pt;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#cc6600;';

  return `<table class="fact-list-tbl">
  <colgroup>
    <col style="width:112px">
    <col style="width:54px">
    <col style="width:50px">
    <col style="width:50px">
    <col style="width:52px">
    <col style="width:44px">
    <col style="width:52px">
    <col style="width:52px">
    <col style="width:44px">
    <col style="width:52px">
    <col style="width:52px">
    <col style="width:40px">
    <col style="width:50px">
  </colgroup>
  <thead>
  <tr class="grp-hdr">
    <th class="th-l" rowspan="2">Omschrijving</th>
    <th rowspan="2">Factuurnummer</th>
    <th rowspan="2">Factuurdatum</th>
    <th rowspan="2">Vervaldatum</th>
    <th colspan="3" style="text-align:center;border-bottom:1pt solid #F7931E;">Gefactureerd</th>
    <th colspan="3" style="text-align:center;border-bottom:1pt solid #F7931E;">Berekend</th>
    <th rowspan="2">Verschil</th>
    <th rowspan="2">Status</th>
    <th rowspan="2">Betaaldatum</th>
  </tr>
  <tr>
    <th>Excl BTW</th><th>BTW</th><th>Totaal</th>
    <th>Excl BTW</th><th>BTW</th><th>Totaal</th>
  </tr>
  </thead>
  <tbody>${rows}</tbody>
  <tfoot><tr>
    <td class="td-l" colspan="4" style="${tfLbl}">Totaal</td>
    <td style="${tfBg}">${exclTot}</td>
    <td style="${tfBg}">${btwTot}</td>
    <td style="${tfBg}">${bedTot}</td>
    <td style="${tfBg}">${exclBerTot}</td>
    <td style="${tfBg}">${btwBerTot}</td>
    <td style="${tfBg}">${berTot}</td>
    <td style="${tfBg}">${verTot}</td>
    <td style="${tfBg};font-size:6pt;font-weight:700;color:#666;text-align:center;" colspan="2">${statParts.join(' · ')}</td>
  </tr></tfoot>
</table>`;
}

function buildPdfRvrTariefHTML() {
  if (!nwRvrTariefRows.length) return '';
  const first = nwRvrTariefRows[0];
  const fmtPeriod = d => d ? new Date(d).toLocaleDateString('nl-NL',{month:'2-digit',year:'numeric'}) : '';
  const periodLabel = first.geldig_van && first.geldig_tot
    ? `Geldig ${fmtPeriod(first.geldig_van)} – ${fmtPeriod(first.geldig_tot)} · Per punt: ${formatAmount(nwRvrPerPunt)} · Adm: ${formatAmount(nwRvrAdmKosten)}`
    : '';

  // Bepaal de actieve rij op basis van het huidige dossier
  const activeTypeKlant = nwGetRvrTypeKlant();
  const toevA = nwDossierData?.toevoeging_a === 1;
  const toevB = nwDossierData?.toevoeging_b === 1;
  const activeSubType = (toevA && toevB) ? 'dubbele toevoeging' : 'enkele toevoeging';

  // Group by type_klant (preserve insertion order)
  const groups = [], seen = {};
  nwRvrTariefRows.forEach(r => {
    if (!seen[r.type_klant]) { seen[r.type_klant] = []; groups.push(seen[r.type_klant]); }
    seen[r.type_klant].push(r);
  });
  let bodyRows = '';
  groups.forEach(rijen => {
    rijen.forEach((r, idx) => {
      const toev=parseFloat(r.toev)||0, afh=parseFloat(r.afhechting)||0, kp=parseFloat(r.kinderen_punten)||0;
      const totP = toev+afh+kp;
      const adm = r.sub_type==='dubbele toevoeging' ? nwRvrAdmKosten*2 : nwRvrAdmKosten;
      const bedrag = (totP*nwRvrPerPunt+adm)*1.21;
      const isActive = activeTypeKlant && r.type_klant === activeTypeKlant && r.sub_type === activeSubType;
      const rowBg = isActive ? 'background:#FFF3E0 !important;' : '';
      const cellStyle = isActive
        ? 'background:#FFF3E0;border-top:1.5pt solid #F7931E;border-bottom:1.5pt solid #F7931E;font-weight:800;'
        : '';
      const firstCellStyle = isActive
        ? 'background:#FFF3E0;border-top:1.5pt solid #F7931E;border-bottom:1.5pt solid #F7931E;border-left:3pt solid #F7931E;font-weight:800;'
        : '';
      const lastCellStyle = isActive
        ? 'background:#FFF3E0;border-top:1.5pt solid #F7931E;border-bottom:1.5pt solid #F7931E;border-right:1.5pt solid #F7931E;font-weight:800;color:#c96800;'
        : 'font-weight:800;';
      bodyRows += `<tr>
        <td class="td-l" style="${firstCellStyle}">${idx===0?_esc(r.type_klant):''}</td>
        <td class="td-l" style="${cellStyle}">${_esc(r.sub_type||'—')}${isActive?' ◀':''}</td>
        <td style="${cellStyle}">${toev||'—'}</td>
        <td style="${cellStyle}">${afh||'—'}</td>
        <td style="${cellStyle}">${kp||'—'}</td>
        <td style="${cellStyle}font-weight:800;">${totP}</td>
        <td style="${lastCellStyle}">${formatAmount(bedrag)}</td>
      </tr>`;
    });
  });
  return `${periodLabel?`<p style="font-size:7pt;color:#888;margin-bottom:6px;font-family:Nunito,sans-serif;font-weight:600;">${_esc(periodLabel)}</p>`:''}
<table class="fact-list-tbl">
  <thead><tr>
    <th class="th-l">Type klant</th><th class="th-l">Soort</th>
    <th>Toev.</th><th>Afh.</th><th>Kind.pt.</th><th>Totaal pt.</th><th>Bedrag incl BTW</th>
  </tr></thead>
  <tbody>${bodyRows}</tbody>
</table>`;
}

// ── Init ──
async function init(){
  const{data:{session}}=await db.auth.getSession();
  document.getElementById('loadingOverlay').style.display='none';
  if(!session){window.location.href='index.html';return;}
  window._clUser=session.user.email;
  document.getElementById('userEmail').textContent=session.user.email;

  const params=new URLSearchParams(location.search);
  const factuurId=params.get('id');
  const dossierId=params.get('dossier_id');
  if(!factuurId&&!dossierId){window.location.href='facturen.html';return;}

  if(dossierId){
    // Check if there's an existing main factuur for this dossier (no sub_label in regels)
    // If so, load it so we use the saved period/diensten and can auto-save period changes via Details tab
    const{data:existingF}=await db.from('facturen').select('*').eq('dossier_id',dossierId);
    const mainFactuur=(existingF||[]).find(f=>!f.regels?.sub_label);
    if(mainFactuur){
      await loadAllData(mainFactuur);
    }else{
      await loadAllDataFromDossier(dossierId);
    }
    if(!nwDossierData){document.getElementById('appScreen').style.display='block';return;}
    await loadDossierFacturen();
  } else {
    const{data:factuur}=await db.from('facturen').select('*').eq('id',factuurId).single();
    if(!factuur){showToast('Factuur niet gevonden');document.getElementById('appScreen').style.display='block';return;}
    if(factuur.regels?.sub_label&&factuur.dossier_id){
      // Sub-factuur opened directly — look up main factuur to restore saved period
      const{data:existingF2}=await db.from('facturen').select('*').eq('dossier_id',factuur.dossier_id);
      const mainF2=(existingF2||[]).find(f=>!f.regels?.sub_label);
      if(mainF2){await loadAllData(mainF2);}else{await loadAllDataFromDossier(factuur.dossier_id);}
      if(!nwDossierData){document.getElementById('appScreen').style.display='block';return;}
      await loadDossierFacturen();
    } else {
      await loadAllData(factuur);
      await loadDossierFacturen();
    }
  }
  computeNwFactLines();

  // Set factor inputs
  const zsInp=document.getElementById('nw-zs-factor-inp');
  zsInp.value=Math.round(nwZsFactor*100);
  zsInp.addEventListener('change',()=>{const v=parseFloat(zsInp.value.replace(',','.'))||54;nwZsFactor=v/100;zsInp.value=Math.round(nwZsFactor*100);sessionStorage.setItem('nw_zs_factor',nwZsFactor);rebuildTables();});
  const coInp=document.getElementById('nw-zs-co-factor-inp');
  coInp.value=Math.round(nwZsCoFactor*100);
  coInp.addEventListener('change',()=>{const v=parseFloat(coInp.value.replace(',','.'))||25;nwZsCoFactor=v/100;coInp.value=Math.round(nwZsCoFactor*100);sessionStorage.setItem('nw_zs_co_factor',nwZsCoFactor);rebuildTables();});

  rebuildTables();
  document.getElementById('appScreen').style.display='block';
  equalizeOmschrijvingWidth();
}

init();
</script>
</body>
</html>
